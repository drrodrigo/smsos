# O GUARDIÕESSOS NO IPHONE: monta, assina e manda para a Apple, e deixa o build no TestFlight.
# Espelha .github/workflows/pdv-iphone.yml do PDV (drrodrigo/catologoonline).
#
# A chave da Apple NÃO é segredo do GitHub: ela mora no Supabase (os MESMOS segredos do PDV, no
# mesmo projeto), e a porta guardioes-apple-envio a entrega só a esta rotina, conferindo o token de
# identidade do GitHub (id-token: write). O certificado de distribuição fica cifrado na release
# guardioes-certificado-apple, com a senha GUARDIOES_SENHA_DA_CHAVE (um segredo deste repositório).
#
# Roda PELO BOTÃO (Actions > aplicativo do iPhone (GuardiõesSOS) > Run workflow), quando ele pedir.
# Pré-requisitos (uma vez): criar o app br.com.guardioessos na App Store Connect (a Apple não deixa
# robô criar app) e criar o segredo GUARDIOES_SENHA_DA_CHAVE no repositório.

name: aplicativo do iPhone (GuardiõesSOS)

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: guardioes-iphone-${{ github.ref }}
  # Nunca cortar no meio de um envio para a Apple.
  cancel-in-progress: false

jobs:
  iphone:
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      enviado: ${{ steps.enviar.outputs.enviado }}
    steps:
      - uses: actions/checkout@v4

      - name: O Xcode 26 (a Apple só aceita envio feito com o SDK do iOS 26)
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)"
          echo "Xcode escolhido: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Chave do gateway de SMS (segredo -> Secrets.swift, fica so no build)
        env:
          GATEWAY_KEY: ${{ secrets.GUARDIOES_GATEWAY_KEY }}
        run: |
          B64=$(printf '%s' "$GATEWAY_KEY" | base64 | tr -d '\n')
          printf 'import Foundation\nenum Secrets {\n    static let gatewayKey = String(data: Data(base64Encoded: "%s") ?? Data(), encoding: .utf8) ?? ""\n}\n' "$B64" > ios/GuardioesSOS/Secrets.swift
          if [ -n "$GATEWAY_KEY" ]; then echo "chave do gateway: presente"; else echo "chave do gateway: vazia (modo teste)"; fi

      - name: Gerar o projeto do Xcode (XcodeGen)
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Compilar sem assinatura (prova que compila)
        run: |
          xcodebuild -project ios/GuardioesSOS.xcodeproj -scheme GuardioesSOS -configuration Release \
            -destination 'generic/platform=iOS' -quiet build CODE_SIGNING_ALLOWED=NO

      - name: A chave da Apple (pela porta guardioes-apple-envio do Supabase)
        id: chave
        run: bash ios/ci/chave-da-apple.sh "$RUNNER_TEMP/apple"

      - uses: actions/setup-python@v5
        if: steps.chave.outputs.tem == 'sim'
        with:
          python-version: '3.12'

      - name: Certificado de distribuição e perfil de loja
        id: assinatura
        if: steps.chave.outputs.tem == 'sim'
        env:
          APPLE_CHAVE: ${{ steps.chave.outputs.chave }}
          APPLE_KEY_ID: ${{ steps.chave.outputs.key_id }}
          APPLE_ISSUER_ID: ${{ steps.chave.outputs.issuer }}
          GUARDIOES_SENHA_DA_CHAVE: ${{ secrets.GUARDIOES_SENHA_DA_CHAVE }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pip install --quiet 'pyjwt>=2.8' 'cryptography>=42'
          cd ios/ci && python assinatura.py "$RUNNER_TEMP/assinatura"

      - name: O certificado no chaveiro do Mac, o perfil no lugar do Xcode
        if: steps.chave.outputs.tem == 'sim'
        env:
          GUARDIOES_SENHA_DA_CHAVE: ${{ secrets.GUARDIOES_SENHA_DA_CHAVE }}
          UUID: ${{ steps.assinatura.outputs.uuid }}
        run: |
          A="$RUNNER_TEMP/assinatura"
          KC="$RUNNER_TEMP/guardioes.keychain-db"
          KC_SENHA="$(openssl rand -hex 24)"
          echo "::add-mask::$KC_SENHA"
          security create-keychain -p "$KC_SENHA" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_SENHA" "$KC"
          # O certificado intermediário da Apple (WWDR G3), para a cadeia fechar no codesign.
          curl -sSfL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$A/wwdr.cer"
          security import "$A/wwdr.cer" -k "$KC" -T /usr/bin/codesign || true
          security import "$A/certificado.p12" -k "$KC" -P "$GUARDIOES_SENHA_DA_CHAVE" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_SENHA" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          for pasta in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$pasta"
            cp "$A/perfil.mobileprovision" "$pasta/$UUID.mobileprovision"
          done
          rm -f "$A/certificado.p12"
          echo "KC=$KC" >> "$GITHUB_ENV"

      - name: Arquivar e assinar
        if: steps.chave.outputs.tem == 'sim'
        env:
          TIME: ${{ steps.assinatura.outputs.time }}
          PERFIL: ${{ steps.assinatura.outputs.perfil }}
        run: |
          xcodebuild -project ios/GuardioesSOS.xcodeproj -scheme GuardioesSOS -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/GuardioesSOS.xcarchive" -quiet archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TIME" CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PERFIL" OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Enviar para a App Store Connect
        id: enviar
        if: steps.chave.outputs.tem == 'sim'
        env:
          APPLE_CHAVE: ${{ steps.chave.outputs.chave }}
          APPLE_KEY_ID: ${{ steps.chave.outputs.key_id }}
          APPLE_ISSUER_ID: ${{ steps.chave.outputs.issuer }}
        run: |
          if [ "${{ steps.chave.outputs.app_existe }}" != "sim" ]; then
            echo "::warning::O app br.com.guardioessos ainda não existe na App Store Connect (a Apple não deixa robô criar app). O build foi montado e assinado, mas não foi enviado. Crie o app e rode de novo."
            echo "enviado=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/GuardioesSOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/assinatura/ExportOptions.plist" -exportPath "$RUNNER_TEMP/saida" \
            -authenticationKeyPath "$APPLE_CHAVE" -authenticationKeyID "$APPLE_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ISSUER_ID"
          echo "enviado=sim" >> "$GITHUB_OUTPUT"
          echo "Build ${{ github.run_number }} enviado para a App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Apagar a chave e o chaveiro do Mac
        if: always()
        run: |
          [ -n "${KC:-}" ] && security delete-keychain "$KC" || true
          rm -rf "$RUNNER_TEMP/apple" "$RUNNER_TEMP/assinatura"

  testflight:
    needs: iphone
    if: needs.iphone.outputs.enviado == 'sim'
    # Esperar a Apple processar é só espera: no Linux, que custa menos minutos que o Mac.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: A chave da Apple (pela porta guardioes-apple-envio do Supabase)
        id: chave
        run: bash ios/ci/chave-da-apple.sh "$RUNNER_TEMP/apple"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: TestFlight (grupo interno Equipe, e grupo Guardiões quando houver)
        env:
          APPLE_CHAVE: ${{ steps.chave.outputs.chave }}
          APPLE_KEY_ID: ${{ steps.chave.outputs.key_id }}
          APPLE_ISSUER_ID: ${{ steps.chave.outputs.issuer }}
        run: |
          pip install --quiet 'pyjwt>=2.8' 'cryptography>=42'
          VERSAO="$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"$/\1/p' ios/project.yml)"
          cd ios/ci && python testflight.py "$VERSAO" "${{ github.run_number }}"

      - name: Apagar a chave
        if: always()
        run: rm -rf "$RUNNER_TEMP/apple"

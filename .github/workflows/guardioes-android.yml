name: fábrica do Android (APK de teste)

# Gera um APK de TESTE (debug) do GuardiõesSOS para instalar no celular (sideload).
# Dispara sozinho a cada push nesta branch; o APK fica em Actions -> esta execução -> Artifacts.
on:
  push:
    branches: [feat/botao-sem-acessibilidade]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # O runner já vem com o SDK do Android em $ANDROID_HOME. Só aceitamos as licenças e
      # garantimos o platform/build-tools 37 (compileSdk = 37). Não usamos a ação setup-android:
      # ela tenta instalar o pacote obsoleto "tools" e falha.
      - name: Preparar o SDK do Android
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Permissão do gradlew
        run: chmod +x ./gradlew

      - name: Montar o APK de teste (debug)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Guardar o APK (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuardioesSOS-teste-gesto
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Testes unitários
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

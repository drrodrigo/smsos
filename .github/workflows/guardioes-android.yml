name: fábrica do Android (APK de teste)

# Gera um APK de TESTE (debug) do GuardiõesSOS para instalar no celular (sideload).
#
# ATENÇÃO (06/11): os runners da nuvem do GitHub NÃO encontram o SDK Android 37
# (platforms;android-37) no repositório público do Google — o projeto usa compileSdk = 37, que
# por enquanto só existe pré-instalado no ambiente de desenvolvimento, não nos runners hospedados.
# Por isso esta fábrica está em modo MANUAL (não roda a cada push). Enquanto o android-37 não
# estiver disponível nos runners, os APKs de teste são compilados no ambiente de dev e entregues
# direto. Quando o runner tiver o android-37 (ou quando o compileSdk baixar para uma versão
# pública), é só religar o gatilho de push abaixo.
on:
  workflow_dispatch:
  # push:
  #   branches: [feat/botao-sem-acessibilidade]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # O runner já vem com o SDK do Android em $ANDROID_HOME. Não usamos a ação setup-android:
      # ela tenta instalar o pacote obsoleto "tools" e falha.
      - name: Preparar o SDK do Android
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Permissão do gradlew
        run: chmod +x ./gradlew

      - name: Montar o APK de teste (debug)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Guardar o APK (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuardioesSOS-teste-gesto
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Testes unitários
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
